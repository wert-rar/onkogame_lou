<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Онкодежурство</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна узкая колонка, как лист назначений; шапка случая — браслет пациента; ход смены — журнал-чат с панелью действий снизу. Акцент — золотая лента детской онкологии. */
:root{
  --bg:#e9edf1; --paper:#ffffff; --paper-2:#f3f5f8; --ink:#132030; --ink-2:#36475b; --muted:#5f6e82; --line:#d2d9e2;
  --gold:#8a5a00; --gold-ink:#ffffff; --gold-soft:#f6e8c8; --you:#132030; --you-ink:#f3f5f8;
  --ok:#1b6e44; --ok-soft:#dcefe3; --bad:#ad261d; --bad-soft:#f9e1de; --warn:#875500; --warn-soft:#f8edd3;
  --nurse:#0b6b70; --nurse-soft:#d6eeef; --kin:#6a3d9a; --kin-soft:#ece3f6; --pt:#1d5a9e; --pt-soft:#dde9f7;
  --shadow:0 1px 2px rgba(19,32,48,.06),0 6px 18px rgba(19,32,48,.07);
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1219; --paper:#141d27; --paper-2:#1a2531; --ink:#e5ebf1; --ink-2:#c1ccd8; --muted:#8d9bac; --line:#273443;
  --gold:#e4ac44; --gold-ink:#1b1305; --gold-soft:#372a10; --you:#e4ac44; --you-ink:#1b1305;
  --ok:#63cd94; --ok-soft:#13301e; --bad:#ff8e83; --bad-soft:#3a1a17; --warn:#efb65a; --warn-soft:#36290f;
  --nurse:#62d0d5; --nurse-soft:#0f2e30; --kin:#c9a6f2; --kin-soft:#2a1d3b; --pt:#8dbaf3; --pt-soft:#15263b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1219; --paper:#141d27; --paper-2:#1a2531; --ink:#e5ebf1; --ink-2:#c1ccd8; --muted:#8d9bac; --line:#273443;
  --gold:#e4ac44; --gold-ink:#1b1305; --gold-soft:#372a10; --you:#e4ac44; --you-ink:#1b1305;
  --ok:#63cd94; --ok-soft:#13301e; --bad:#ff8e83; --bad-soft:#3a1a17; --warn:#efb65a; --warn-soft:#36290f;
  --nurse:#62d0d5; --nurse-soft:#0f2e30; --kin:#c9a6f2; --kin-soft:#2a1d3b; --pt:#8dbaf3; --pt-soft:#15263b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.lede{color:var(--ink-2);max-width:62ch}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--f-display);letter-spacing:-.01em;background:none;border:0;padding:0}
.brand svg{width:22px;height:22px;color:var(--gold)}
.nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--ink-2);white-space:nowrap;font-weight:500;font-size:14px}
.nav button:hover{background:var(--paper-2)}
.nav button[aria-current="page"]{background:var(--gold-soft);color:var(--ink)}
@media (max-width:560px){.top .wrap{gap:6px}.nav{margin-left:0;width:100%}}

main{padding-block:20px 48px}

/* кнопки и чипы */
.btn{border:1px solid var(--line);background:var(--paper);padding:10px 16px;border-radius:10px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* главная */
.hero{display:grid;gap:16px;padding:28px 24px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font:700 clamp(28px,6vw,44px)/1.08 var(--f-display);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--gold)}
.clock{position:absolute;right:20px;top:18px;font:500 13px var(--f-mono);color:var(--muted)}
@media (max-width:560px){.clock{position:static;margin-bottom:-10px}}
.field{display:grid;gap:8px}
.lbl{font-size:13px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:2px}
.mode:hover{border-color:var(--gold)}
.mode-n{font:700 26px/1.1 var(--f-display);color:var(--gold)}
.mode-t{font-weight:600;font-size:16px}
.mode-d{color:var(--muted);font-size:13.5px}
.note{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-size:13.5px;display:grid;gap:8px}

/* браслет пациента */
.band{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:var(--paper);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.band::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--gold)}
.tag{display:grid;line-height:1.25;min-width:0}
.pp{display:block;flex:0 0 auto;line-height:0;border-radius:50%;box-shadow:0 0 0 2px var(--paper),0 1px 4px rgba(19,32,48,.15)}
.pp svg{display:block}
.em-card .pp{float:left;margin-right:12px}
.tag b{font-size:17px}
.anthro{display:flex;gap:14px;margin:0}
.anthro div{display:grid}
.anthro dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.anthro dd{margin:0;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.vit{display:flex;gap:14px;align-items:center;margin-left:auto}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.bar{width:90px;height:8px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s,background .4s}
.meter b,.pts b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.pts{font-size:13px;color:var(--muted)}
@media (max-width:560px){.vit{margin-left:0;width:100%;justify-content:space-between}}

/* журнал */
.chat{display:flex;flex-direction:column;gap:10px;padding-block:16px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);animation:pop .25s ease-out}
.msg .who{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.m-you{align-self:flex-end;background:var(--you);color:var(--you-ink);border-color:var(--you)}
.m-sys{align-self:center;background:transparent;border-style:dashed;color:var(--ink-2);font-size:14px;text-align:center}
.m-exam{background:var(--paper-2)}
/* кто говорит: медсестра, родитель, сам пациент — цветная плашка и полоса слева */
.m-nurse{--sp:var(--nurse);--sp-soft:var(--nurse-soft)}
.m-mom,.m-dad{--sp:var(--kin);--sp-soft:var(--kin-soft)}
.m-pt{--sp:var(--pt);--sp-soft:var(--pt-soft)}
.m-nurse,.m-mom,.m-dad,.m-pt{border-left:4px solid var(--sp)}
.m-nurse .who,.m-mom .who,.m-dad .who,.m-pt .who{display:inline-block;background:var(--sp-soft);color:var(--sp);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.m-lab .txt,.m-img .txt,.m-path .txt,.m-cons .txt{font:400 13.5px/1.6 var(--f-mono)}
.m-lab,.m-img,.m-path,.m-cons{border-left:3px solid var(--line)}
.m-ask{background:var(--gold-soft);border-color:transparent;font-weight:500}
.m-ask .who{color:var(--gold)}
.m-boss{max-width:100%}
.m-report{max-width:100%;padding:20px}
@keyframes pop{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.bar i{transition:none}}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:99px;margin-bottom:6px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mid{background:var(--paper-2);color:var(--muted)}
.m-boss p+p{margin-top:6px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--gold);font-weight:500}
ul.why{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
ul.why li{padding:8px 10px;border-radius:10px;background:var(--paper-2);font-size:14px}
ul.why li .mk{font-weight:600;margin-right:6px}
.is-ok .mk{color:var(--ok)} .is-bad .mk{color:var(--bad)} .is-miss .mk{color:var(--warn)} .is-neutral .mk{color:var(--muted)}

/* панель действий */
.dock{position:sticky;bottom:0;z-index:3;background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(19,32,48,.08);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));max-height:52vh;overflow:auto;display:grid;gap:10px}
.dock-h{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:var(--paper-2);padding:6px 10px;border-radius:8px;font-size:13.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs small{opacity:.7;font-family:var(--f-mono)}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:14.5px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{color:var(--muted);background:var(--paper-2)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt[aria-pressed="true"]::before{content:"✓ ";color:var(--gold);font-weight:700}
.dock-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* разбор */
.rep-k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.rep-k div{background:var(--paper-2);border-radius:12px;padding:10px 12px;display:grid}
.rep-k b{font:700 20px/1.2 var(--f-display)}
.rep-k span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.rep-k b{font-size:16px}}
.m-report h2{font:700 19px/1.25 var(--f-display);margin-top:4px}
.m-report h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
td:first-child{white-space:nowrap;width:1%}
td .c{color:var(--muted);font-size:13px}
ul.pearls{margin:0;padding-left:18px;display:grid;gap:6px}
ol.src{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:4px}

/* блиц */
.blitz{display:grid;gap:14px}
.blitz-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.count{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.situation p{font-size:18px;line-height:1.5}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .btn{padding:16px;font-size:17px;font-weight:600}
.yn .yes{border-color:var(--ok);color:var(--ok)}
.yn .no{border-color:var(--bad);color:var(--bad)}
.yn .btn.chosen{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* препараты */
.page-h{display:grid;gap:10px;margin-bottom:14px}
.page-h h1{font:700 28px/1.15 var(--f-display);letter-spacing:-.01em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}
.dlist{display:grid;gap:8px}
.drug{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:0}
.drug summary{list-style:none;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;color:var(--ink);font-weight:400}
.drug summary::-webkit-details-marker{display:none}
.dn{font-weight:600;font-size:16px}
.dc{grid-column:1;color:var(--muted);font-size:13px}
.drug .badge{grid-column:2;grid-row:1/3;align-self:center}
.dk{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.drug[open] summary{border-bottom:1px solid var(--line)}
.dbody{padding:12px 14px;display:grid;gap:10px;font-size:14px}
.dbody h4{margin:0 0 2px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dbody ul{margin:0;padding-left:18px}
.dose{font-family:var(--f-mono);font-size:13px}
.badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.ru-ok{background:var(--ok-soft);color:var(--ok)}
.ru-no{background:var(--bad-soft);color:var(--bad)}
.ru-off,.ru-check{background:var(--warn-soft);color:var(--warn)}
.ru-box{padding:10px 12px;border-radius:10px;background:var(--paper-2)}
.ru-box .rep{margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

/* прогресс */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (max-width:560px){.stat-grid{grid-template-columns:1fr 1fr}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid}
.stat b{font:700 22px/1.2 var(--f-display);color:var(--gold)}
.stat span{font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
.case-row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-items:center}
.case-row .pp{grid-column:1;grid-row:1/4}
.case-row:hover{border-color:var(--gold)}
.case-row .cn{font-weight:600;grid-column:2}
.case-row .cc{color:var(--ink-2);font-size:14px;grid-column:2}
.case-row .cd{color:var(--muted);font-size:13px;grid-column:2}
.case-row .cs{grid-column:3;grid-row:1/4;align-self:center;font:500 14px var(--f-mono)}
.grp{margin:18px 0 8px}
.err{font-size:14px;padding:8px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}

/* неотложка */
.em-card{display:grid;gap:12px}
.em-card p{margin-top:2px}
.em-clock{margin-left:auto;font:700 22px var(--f-mono);font-variant-numeric:tabular-nums}
.mon{position:sticky;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;padding:8px;background:#0b1118;border-radius:14px;box-shadow:var(--shadow)}
.mv{display:grid;padding:6px 8px;border-radius:10px;color:#7ef0a8;background:#121c27;min-width:0}
.mv span,.mv small{font-size:11px;letter-spacing:.05em;color:#93a6ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv span{text-transform:uppercase}
.mv b{font:700 22px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mv.crit{color:#ff7466;animation:blink 1s steps(2) infinite}
.mv.crit small{color:#ff7466}
@keyframes blink{50%{background:#3b1714}}
@media (prefers-reduced-motion:reduce){.mv.crit{animation:none;background:#3b1714}}
@media (max-width:420px){.mv b{font-size:18px}.mon{gap:4px;padding:6px}.mv{padding:5px 6px}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .opt{font-size:14px;padding:9px 10px}
.em-dose{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.em-dose input{width:120px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:500 16px var(--f-mono);background:var(--paper);color:var(--ink)}
.em-dose input.bad{border-color:var(--bad)}
.tm{font:500 12px var(--f-mono);color:var(--muted);margin-right:6px;white-space:nowrap}
.m-you .tm{color:inherit;opacity:.7}
/* оценка по категориям */
.cats{display:grid;gap:8px}
.cat{display:grid;grid-template-columns:minmax(120px,170px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.cbar{height:8px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--gold)}
.cat b{font:500 14px var(--f-mono);text-align:right}

/* мини-игры на снимках */
.m-scan{max-width:100%;width:100%;padding:8px;background:#0c1117;border-color:#0c1117}
.m-scan.m-scan-light{background:var(--paper)}
.scan{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation;cursor:crosshair;-webkit-tap-highlight-color:transparent}
.scan .labs{display:none}
.scan.rev .labs{display:block}
.scan .lb{font:600 9.5px var(--f-body);fill:#ffe27a;paint-order:stroke;stroke:#000;stroke-width:2.6px;pointer-events:none}
.scan-diag .lb,.scan-smear .lb{fill:#1a2a3a;stroke:#fff}
.scan .so{font:500 10px var(--f-body);fill:#8fd3c3;pointer-events:none}
.scan .so-l{fill:#5f6e82}
.scan .sl{font:600 11px var(--f-mono);fill:#5f6e82;pointer-events:none}
.scan .mk-e{fill:#4fd1ff;stroke:#00131a;stroke-width:1.5}
.scan .mk-t{fill:#ff5d5d;stroke:#1a0000;stroke-width:1.5}
.scan .mk-l{stroke:#4fd1ff;stroke-width:2.4;stroke-linecap:round}
.scan .mk-x{fill:none;stroke:#ff5d5d;stroke-width:2.4}
.scan .mk-ideal{fill:none;stroke:#5fe0b0;stroke-width:2.2;stroke-dasharray:6 4}
.scan .mk-tgt{fill:none;stroke:#ffd54a;stroke-width:2;stroke-dasharray:4 3}
.scan-hint{font-size:13.5px;color:var(--ink-2)}

<header class="top">

      Онкодежурство

<script src="cases-a.js"></script>
<script src="cases-b.js"></script>
<script src="emerg.js"></script>

<script>
(function(){
"use strict";
const DR = window.DRUGS, CS = window.CASES, BL = window.BLITZ;
const byId = Object.fromEntries(DR.map(d => [d.id, d]));
const app = document.getElementById("app");
const modal = document.getElementById("modal");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Telegram Mini App ----------
   telegram-web-app.js подключает только сборка tools/build.py; вне Telegram его platform — "unknown". */
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform !== "unknown" ? window.Telegram.WebApp : null;
const tgAt = v => TG && TG.isVersionAtLeast(v);
const buzz = ok => { if (tgAt("6.1")) TG.HapticFeedback.notificationOccurred(ok ? "success" : "error"); };
const tgBack = show => { if (tgAt("6.1")) TG.BackButton[show ? "show" : "hide"](); };
if (TG){
  const theme = () => {
    document.documentElement.dataset.theme = TG.colorScheme;
    if (!tgAt("6.1")) return;
    const css = getComputedStyle(document.documentElement);
    TG.setHeaderColor(css.getPropertyValue("--paper").trim());
    TG.setBackgroundColor(css.getPropertyValue("--bg").trim());
  };
  theme();
  TG.onEvent("themeChanged", theme);
  if (tgAt("6.1")) TG.BackButton.onClick(() => {
    if (((C && C.si < C.steps.length) || (E && !E.st.end)) && tgAt("6.2")) TG.showConfirm("Выйти? Результат не сохранится.", ok => { if (ok) go("smena"); });
    else go("smena");
  });
  TG.ready();
  TG.expand();
}

/* ---------- хранение прогресса (только в этом браузере) ---------- */
const KEY = "onkodezhurstvo.v1";
const fresh = () => ({cases:{}, blitz:{best:0, plays:0}, quiz:{best:0, plays:0}, emerg:{}, cats:{}, errors:[]});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); if (!S.cases) S = fresh(); } catch (e) { S = fresh(); }
if (!S.emerg) S.emerg = {};
if (!S.cats) S.cats = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const logErr = t => { S.errors.unshift({t, ts:Date.now()}); S.errors = S.errors.slice(0, 40); save(); };

/* ---------- утилиты ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Расшифровка аббревиатур (glossary.js): tx() — esc() + разметка сокращений для текста на экране.
   В атрибуты (data-*, aria-label, value) по-прежнему идёт esc(). */
const AB = window.ABBR || {};
const abRe = new RegExp("(?<![\\p{L}\\p{N}])(" + Object.keys(AB).sort((a, b) => b.length - a.length)
  .map(k => k.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&")).join("|") + ")(?![\\p{L}\\p{N}])", "gu");
const abbr = html => html.replace(abRe, m => `<abbr class="ab" title="${esc(AB[m])}">${m}</abbr>`);
const tx = s => abbr(esc(s));
/* портрет пациента (portrait.js) */
const face = (p, size) => window.PORTRAIT && p.look ? `<span class="pp">${window.PORTRAIT(p.look, size)}</span>` : "";
const br = s => abbr(esc(s).replace(/\n/g, "<br>"));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const bsa = (w, h) => Math.sqrt(w * h / 3600); // формула Мостеллера
const comma = n => String(n).replace(".", ",");
const RU = {ok:"В РФ зарегистрирован", no:"В РФ не зарегистрирован", off:"В РФ — вне инструкции", check:"Регистрацию уточнить"};
const G = {lab:"Лаборатория", img:"Визуализация", inv:"Пункции и биопсии", cons:"Прочее"};
const WHO = {scan:"", nurse:"Медсестра", mom:"Мама", dad:"Папа", lab:"Лаборатория", img:"Лучевая диагностика", path:"Морфология", cons:"Консультант", boss:"Заведующая", exam:"Осмотр", sys:"", you:"", report:""};
const VERD = {need:["ok","Нужно"], ok:["mid","Уместно"], no:["warn","Лишнее"], harm:["bad","Опасно"], miss:["bad","Пропущено"], whom:["warn","Не тот собеседник"]};

/* ---------- навигация ---------- */
let C = null, B = null, Q = null, SH = null, homeCat = "Все", dFilter = {q:"", g:"all"};
const VIEWS = {smena:renderHome, patients:renderList, blitz:startBlitz, emerg:renderEmerg, drugs:renderDrugs, progress:renderProgress};
function go(v){
  C = null;
  stopEmerg();
  if (!VIEWS[v]) v = "smena";
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.go === v ? "page" : "false"));
  tgBack(v !== "smena");
  VIEWS[v]();
  window.scrollTo(0, 0);
}
function setNav(v){ document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.go === v ? "page" : "false")); }

/* ---------- главная ---------- */
function renderHome(){
  const cats = ["Все", ...new Set(CS.map(c => c.cat))];
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
  app.innerHTML = `
  <section class="hero">
    <span class="clock" aria-hidden="true">${hh}:${mm} · пост №2</span>
    <p class="eyebrow">Детская онкология и гематология</p>
    <h1>Ночная смена.<br><em>Пять пациентов.</em></h1>
    <p class="lede">Вы дежурите в детском онкологическом отделении. Осматривайте поступающих, назначайте обследования, ставьте диагноз и выбирайте лечение — протокол, препараты, профилактику осложнений. После каждого решения заведующая разбирает ваш выбор. А между пациентами может случиться срочный вызов — тогда счёт идёт на минуты.</p>
    <div class="field"><span class="lbl">Профиль смены</span>
      <div class="chips" id="cats">${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === homeCat}">${esc(c)}</button>`).join("")}</div>
    </div>
    <div class="row"><button class="btn primary big" id="startShift">Заступить на смену</button></div>
  </section>
  <section class="modes">
    <button class="mode" data-go="patients"><span class="mode-n">${CS.length}</span><span class="mode-t">Пациенты</span><span class="mode-d">Любой случай отдельно — опухоли и их «двойники»</span></button>
    <button class="mode" data-go="blitz"><span class="mode-n">${BL.length}</span><span class="mode-t">Лечить или нет</span><span class="mode-d">Быстрые решения у постели больного</span></button>
    <button class="mode" data-go="emerg"><span class="mode-n">${ER.length}</span><span class="mode-t">Неотложка</span><span class="mode-d">Мини-игра на время: монитор, дозы, решения за секунды</span></button>
    <button class="mode" data-go="drugs"><span class="mode-n">${DR.length}</span><span class="mode-t">Препараты</span><span class="mode-d">Механизм, токсичность, защита, доступность в РФ</span></button>
  </section>
  <aside class="note">
    <p><b>Учебный симулятор.</b> Схемы и дозы взяты из клинических рекомендаций МЗ РФ и протоколов, на которых они основаны (ALL-MB 2015, AIEOP-BFM, SIOP, EuroNet-PHL, EpSSG, EURAMOS и др.); различия с COG отмечены в разборах. Источники — в конце каждого случая. Назначения в реальной практике — только по актуальной редакции протокола вашего центра.</p>
    <p>Регистрация препаратов в РФ сверена по справочнику Видаль (октябрь 2026). Незарегистрированные препараты помечены, к ним указана замена.</p>
  </aside>`;
}
/* смена: пациенты по очереди, а между ними — срочный вызов (одна неотложка, иногда две; не первым).
   SH.list — [{cs} | {em:id сценария}], SH.results — итоги по порядку. */
function startShift(){
  const pool = CS.filter(c => homeCat === "Все" || c.cat === homeCat);
  const list = shuffle(pool).slice(0, Math.min(5, pool.length)).map(cs => ({cs}));
  const names = list.map(it => it.cs.p.n);
  // срочный вызов — примерно раз в две-три смены: с вероятностью 25%, а на третьей смене подряд без вызова — обязательно
  const since = S.shiftsNoEm || 0, want = since >= 2 || Math.random() < 0.25;
  const ems = want ? shuffle(ER.filter(sc => !names.includes(sc.p.n))).slice(0, 1) : [];
  S.shiftsNoEm = ems.length ? 0 : since + 1;
  save();
  ems.forEach(sc => list.splice(1 + Math.floor(Math.random() * Math.max(1, list.length - 1)), 0, {em:sc.id}));
  SH = {list, i:0, results:[]};
  startCase(list[0].cs, SH);
}
function shiftNext(){
  SH.i++;
  const it = SH.list[SH.i];
  return it.em ? startEmerg(it.em, true, SH) : startCase(it.cs, SH);
}
const shiftButton = sh => sh.i + 1 < sh.list.length ? `<button class="btn primary" id="nextPatient">${sh.list[sh.i + 1].em ? "Дальше по смене →" : "Следующий пациент →"}</button>` : `<button class="btn primary" id="shiftReport">Сдать смену</button>`;

/* ---------- случай ---------- */
function startCase(cs, shift){
  stopEmerg();
  const tests = shuffle(cs.tests.map((t, i) => ({t, i})));
  C = {cs, shift, status:80, score:0, tests:tests.map(x => x.t), ordered:[], si:-1, group:null, res:[],
       steps:cs.steps.map(st => Object.assign({}, st, st.t === "scan" ? {} : st.t === "talk" ? {turns:st.turns.map(tn => Object.assign({}, tn, {o:shuffle(tn.o)}))} : {o:shuffle(st.o)}))};
  C.max = cs.tests.filter(t => t[3] === "need").length * 2 +
    cs.steps.reduce((a, st) => a + (st.t === "single" ? 5 : st.t === "talk" ? st.turns.length * 2 : st.t === "scan" ? 2 : st.o.filter(o => o[1]).length * 2), 0) +
    (cs.hx ? cs.hx.q.filter(q => q.v === "need").length * 2 : 0);
  C.group = Object.keys(G).find(g => C.tests.some(t => t[0] === g));
  const p = cs.p;
  setNav(shift ? "smena" : "patients");
  tgBack(true);
  app.innerHTML = `
  <div class="band">
    ${face(p, 52)}<div class="tag"><span class="eyebrow">${shift ? `Пациент ${shift.i + 1} из ${shift.list.length}` : "Пациент"}</span><b>${esc(p.n)}, ${esc(p.age)}</b></div>
    <dl class="anthro">
      <div><dt>Вес</dt><dd>${comma(p.w)} кг</dd></div>
      <div><dt>Рост</dt><dd>${p.h} см</dd></div>
      <div><dt>ППТ</dt><dd>${comma(bsa(p.w, p.h).toFixed(2))} м²</dd></div>
    </dl>
    <div class="vit">
      <div class="meter"><span>Состояние</span><span class="bar" role="img" id="sbarw" aria-label="Состояние пациента"><i id="sbar"></i></span><b id="sval"></b></div>
      <div class="pts">Баллы <b id="pts">0</b></div>
    </div>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="dock" id="dock"></div>`;
  const dock = document.getElementById("dock");
  updBand();
  say("sys", cs.from);
  if (cs.hx){
    C.hx = {asked:[], who:Object.keys(cs.hx.people)[0], g:cs.hx.q[0].g};
    cs.hx.open.forEach(m => say(m[0], m[1]));
    return dockHx();
  }
  cs.intro.forEach(m => say(m[0], m[1]));
  dock.innerHTML = `<div class="dock-f"><button class="btn primary" id="exBtn">Осмотреть пациента</button></div>`;
}
function say(who, html, raw){
  const chat = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "msg m-" + who;
  const label = who === "pt" ? (C.cs.p.sex === "ж" ? "Пациентка" : "Пациент") + " · " + C.cs.p.n : WHO[who] !== undefined ? WHO[who] : who;
  d.innerHTML = (label ? `<div class="who">${esc(label)}</div>` : "") + `<div class="txt">${raw ? html : br(html)}</div>`;
  chat.appendChild(d);
  reveal(d);
  return d;
}
/* Показать новое сообщение над панелью действий. Высоту панели меряем в момент прокрутки:
   она меняется вместе с сообщением (осмотр → список обследований). */
function reveal(el){
  requestAnimationFrame(() => {
    const dock = document.getElementById("dock"), top = document.querySelector(".top");
    const mon = document.getElementById("mon");
    const lo = innerHeight - (dock ? dock.offsetHeight : 0) - 16, hi = (top ? top.offsetHeight : 0) + (mon ? mon.offsetHeight + 10 : 0) + 16;
    const r = el.getBoundingClientRect();
    // длинный ответ показываем с начала, короткий прижимаем к панели
    const dy = r.height > lo - hi ? r.top - hi : r.bottom - lo;
    if (dy > 0) window.scrollTo({top: scrollY + dy, behavior: reduce ? "auto" : "smooth"});
  });
}
function ask(head, q){
  const chat = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "msg m-ask";
  d.innerHTML = `<div class="who">${esc(head)}</div><div class="txt">${br(q)}</div>`;
  chat.appendChild(d);
  reveal(d);
}
function setStatus(delta){ C.status = Math.max(0, Math.min(100, C.status + delta)); }
function updBand(){
  const bar = document.getElementById("sbar");
  if (!bar) return;
  bar.style.width = C.status + "%";
  bar.style.background = C.status >= 60 ? "var(--ok)" : C.status >= 35 ? "var(--warn)" : "var(--bad)";
  document.getElementById("sval").textContent = C.status;
  document.getElementById("sbarw").setAttribute("aria-label", "Состояние пациента: " + C.status + " из 100");
  document.getElementById("pts").textContent = C.score;
}
/* ---------- расспрос: анамнез собирает сам игрок ----------
   case.hx: open — с чего начинается, people — кого можно спросить, limit — сколько вопросов успеваете,
   q — вопросы {g группа, t текст, kw ключевые слова для своего вопроса, v need/ok/no, a ответы по говорящим, c зачем}. */
const norm = s => s.toLowerCase().replace(/ё/g, "е");
function dockHx(){
  const hx = C.cs.hx, left = hx.limit - C.hx.asked.length, who = C.hx.who;
  const done = i => C.hx.asked.some(a => a.i === i && a.who === who);
  document.getElementById("dock").innerHTML = `
    <div class="dock-h"><span>Расспрос</span><span class="muted">вопросов осталось: ${left}</span></div>
    <div class="row hx-who"><span class="lbl">Спросить:</span>${Object.entries(hx.people).map(([w, l]) => `<button class="chip" data-hw="${w}" aria-pressed="${w === who}">${esc(l)}</button>`).join("")}</div>
    <div class="hx-free"><input id="hxIn" type="text" placeholder="Свой вопрос…" autocomplete="off" aria-label="Свой вопрос" ${left ? "" : "disabled"}><button class="btn" id="hxAsk" ${left ? "" : "disabled"}>Спросить</button></div>
    <div class="tabs" role="tablist">${[...new Set(hx.q.map(q => q.g))].map(g => `<button role="tab" data-hg="${esc(g)}" aria-selected="${g === C.hx.g}">${esc(g)}</button>`).join("")}</div>
    <div class="opts">${hx.q.map((q, i) => q.g !== C.hx.g ? "" : `<button class="opt" data-hq="${i}" ${done(i) || !left ? "disabled" : ""}>${done(i) ? "✓ " : ""}${tx(q.t)}</button>`).join("")}</div>
    <div class="dock-f"><button class="btn primary" id="hxDone">Достаточно — к осмотру →</button></div>`;
}
function askHx(i, text){
  const q = C.cs.hx.q[i], who = C.hx.who;
  if (C.hx.asked.length >= C.cs.hx.limit) return;
  say("you", text || q.t);
  if (C.hx.asked.some(a => a.i === i && a.who === who)){ say("sys", "Вы уже об этом спрашивали."); return dockHx(); }
  const a = q.a[who] || "~…";
  say(who, a.replace(/^~/, ""));
  C.hx.asked.push({i, who, info:!a.startsWith("~")});
  dockHx();
}
function askFree(){
  const inp = document.getElementById("hxIn"), raw = inp.value.trim(), s = norm(raw);
  if (!s) return inp.focus();
  let best = -1, hits = 0;
  // ключевое слово — основа слова: совпадение только с начала слова («рак» не найдётся в «абракадабре»)
  const has = k => new RegExp("(^|[^\\p{L}])" + norm(k).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "u").test(s);
  C.cs.hx.q.forEach((q, i) => { const n = q.kw.filter(has).length; if (n > hits){ hits = n; best = i; } });
  if (best < 0){
    const w = C.hx.who, she = w === "mom" || w === "nurse" || (w === "pt" && C.cs.p.sex === "ж");
    say("you", raw);
    say(w, `Не ${she ? "поняла" : "понял"} вопрос. Спросите по-другому?`);
    return dockHx();
  }
  askHx(best, raw);
}
/* итог расспроса: по вопросу — лучший ответ из полученных */
function hxRows(){
  const hx = C.cs.hx, rows = [];
  hx.q.forEach((q, i) => {
    const got = C.hx.asked.filter(a => a.i === i);
    if (got.length) rows.push([q.v === "need" && !got.some(a => a.info) ? "whom" : q.v, q]);
    else if (q.v === "need") rows.push(["miss", q]);
  });
  return rows;
}

/* ---------- мини-игры на снимках (scenes.js) ----------
   find — тапнуть по цели; needle — тап по коже (вход), затем по цели (кончик иглы). Две попытки:
   с первой — полный балл, со второй — половина. После ответа — подписи, контур цели и правильная траектория. */
function scanStep(){
  const st = C.steps[C.si], sc = window.SCENES[st.scene]();
  ask(st.h, st.q);
  const d = say("scan", window.SCAN.svg(sc), true);
  if (["diag", "smear"].includes(sc.mod)) d.classList.add("m-scan-light");
  const svg = d.querySelector("svg.scan");
  C.scan = {sc, st, svg, msg:d, pts:[], tries:0};
  d.insertAdjacentHTML("beforeend", `<div class="scan-cap" hidden></div>`);
  svg.addEventListener("click", scanTap);
  scanDock();
}
function scanDock(){
  const S2 = C.scan, need = S2.st.mode === "needle" ? 2 : 1, n = S2.pts.length;
  const hint = S2.st.mode === "needle" ? (n === 0 ? "Нажмите на снимок: сначала точка входа на коже." : n === 1 ? "Теперь — куда довести кончик иглы." : "Готово. Можно проверить или поставить заново.") : (n ? "Готово. Можно проверить или отметить заново." : "Нажмите на снимок в нужном месте.");
  document.getElementById("dock").innerHTML = `<div class="dock-h"><span>${S2.st.mode === "needle" ? "Игла" : "Найдите на снимке"}</span><span class="muted">попытка ${S2.tries + 1} из 2</span></div>
    <p class="scan-hint">${hint}</p>
    <div class="dock-f"><button class="btn" id="scReset" ${n ? "" : "disabled"}>Сбросить</button><button class="btn primary" id="scCheck" ${n >= need ? "" : "disabled"}>Проверить</button></div>`;
}
/* результат — прямо под снимком, чтобы разбор и подписи были видны вместе */
function scanCap(html){
  const cap = C.scan.msg.querySelector(".scan-cap");
  cap.innerHTML = html;
  cap.hidden = false;
  reveal(C.scan.msg);
}
function svgPt(svg, e){
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10];
}
function scanTap(e){
  const S2 = C && C.scan;
  if (!S2 || S2.svg !== e.currentTarget || S2.done) return;
  const p = svgPt(S2.svg, e);
  if (S2.st.mode === "find" || S2.pts.length >= 2) S2.pts = [p]; else S2.pts.push(p);
  scanMarks();
  scanDock();
}
function scanMarks(extra){
  const S2 = C.scan, [a, b] = S2.pts;
  let h = "";
  if (S2.st.mode === "find" && a) h += `<circle cx="${a[0]}" cy="${a[1]}" r="9" class="mk-x"/><circle cx="${a[0]}" cy="${a[1]}" r="2.4" class="mk-t"/>`;
  if (S2.st.mode === "needle"){
    if (a && b) h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="mk-l"/>`;
    if (a) h += `<circle cx="${a[0]}" cy="${a[1]}" r="4.5" class="mk-e"/>`;
    if (b) h += `<circle cx="${b[0]}" cy="${b[1]}" r="4.5" class="mk-t"/>`;
  }
  S2.svg.querySelector(".marks").innerHTML = (extra || "") + h;
}
function scanCheck(){
  const S2 = C.scan, st = S2.st, r = st.mode === "needle" ? window.SCAN.needle(S2.sc, st, S2.pts[0], S2.pts[1]) : window.SCAN.find(S2.sc, st, S2.pts[0]);
  S2.tries++;
  const probs = st.mode === "needle" ? r.probs : r.ok ? [] : [`Это не то: вы отметили «${r.at ? r.at.name : "фон"}».`];
  if (!r.ok && S2.tries < 2){
    buzz(false);
    scanCap(`<span class="pill warn">Не совсем</span><p>${probs.map(esc).join("<br>")}</p><p class="muted">Ещё одна попытка.</p>`);
    S2.pts = [];
    scanMarks();
    return scanDock();
  }
  S2.done = true;
  const got = r.ok ? (S2.tries === 1 ? 1 : 0.5) : 0;
  C.score += got * 2;
  C.res.push({cat:"Снимки и манипуляции", got, max:1});
  buzz(r.ok);
  if (!r.ok) logErr(`${C.cs.p.n} · ${st.h}: ${probs.join(" ")}`);
  // разбор на снимке: контур цели, правильная траектория или точка, подписи
  const tgt = S2.sc.items.filter(it => st.target.includes(window.SCAN.key(it)) && !it.deco).map(it => `<path d="${window.SCAN.pathD(it.pts)}" class="mk-tgt"/>`).join("");
  const ideal = st.mode === "needle" ? `<line x1="${st.ideal[0][0]}" y1="${st.ideal[0][1]}" x2="${st.ideal[1][0]}" y2="${st.ideal[1][1]}" class="mk-ideal"/>` : "";
  S2.svg.classList.add("rev");
  scanMarks(tgt + ideal);
  const pill = r.ok ? (S2.tries === 1 ? ["ok", "Точно"] : ["warn", "Со второй попытки"]) : ["bad", "Неверно"];
  scanCap(`<span class="pill ${pill[0]}">${pill[1]}</span>${probs.length ? `<p>${probs.map(esc).join("<br>")}</p>` : ""}<p>${br(st.why)}</p><p class="muted">${st.mode === "needle" ? "Зелёный пунктир — правильная траектория, жёлтый контур — цель." : "Жёлтый контур — цель."}</p>`);
  updBand();
  dockNext();
}

/* ---------- разговор: сообщить диагноз (SPIKES) ---------- */
function talkTurn(){
  const st = C.steps[C.si], tn = st.turns[C.tk];
  if (tn.pre) say(tn.pre[0], tn.pre[1]);
  ask(`${st.h} · ${tn.stage}`, tn.q);
  document.getElementById("dock").innerHTML = `<div class="opts">${tn.o.map((o, i) => `<button class="opt" data-tk="${i}">${tx(o[0])}</button>`).join("")}</div>`;
}
function answerTalk(i){
  const st = C.steps[C.si], tn = st.turns[C.tk], o = tn.o[i], best = tn.o.reduce((a, x) => x[1] > a[1] ? x : a);
  say("you", o[0]);
  say(st.who, o[2]);
  C.score += o[1];
  C.res.push({cat:"Коммуникация", got:Math.max(0, o[1]), max:2});
  buzz(o[1] > 0);
  if (o[1] < 0) logErr(`${C.cs.p.n} · ${st.h}, ${tn.stage}: «${o[0]}»`);
  const pill = o[1] === 2 ? ["ok", "Хорошо"] : o[1] === 1 ? ["warn", "Допустимо"] : o[1] === 0 ? ["warn", "Можно лучше"] : ["bad", "Ошибка"];
  let h = `<span class="pill ${pill[0]}">${pill[1]} · ${esc(tn.stage)}</span><p>${br(o[3])}</p>`;
  if (o[1] < 2) h += `<p><b>Лучше:</b> ${tx(best[0])}</p><p>${br(best[3])}</p>`;
  say("boss", h, true);
  updBand();
  C.tk++;
  document.getElementById("dock").innerHTML = `<div class="dock-f"><button class="btn primary" id="${C.tk < st.turns.length ? "tkNext" : "nextStep"}">Дальше →</button></div>`;
}

function examine(){
  say("you", "Осматриваю пациента.");
  C.cs.exam.forEach(m => say(m[0] === "sys" ? "exam" : m[0], m[1]));
  dockWorkup();
}
function dockWorkup(){
  const groups = Object.keys(G).filter(g => C.tests.some(t => t[0] === g));
  const left = g => C.tests.filter((t, i) => t[0] === g && !C.ordered.includes(i)).length;
  document.getElementById("dock").innerHTML = `
    <div class="dock-h"><span>Назначить обследование</span><span class="muted">назначено: ${C.ordered.length}</span></div>
    <div class="tabs" role="tablist">${groups.map(g => `<button role="tab" data-g="${g}" aria-selected="${g === C.group}">${G[g]} <small>${left(g)}</small></button>`).join("")}</div>
    <div class="opts">${C.tests.map((t, i) => t[0] !== C.group ? "" : `<button class="opt" data-t="${i}" ${C.ordered.includes(i) ? "disabled" : ""}>${C.ordered.includes(i) ? "✓ " : ""}${tx(t[1])}</button>`).join("")}</div>
    <div class="dock-f"><button class="btn primary" id="toSteps">Достаточно — к диагнозу →</button></div>`;
}
function orderTest(i){
  const t = C.tests[i];
  C.ordered.push(i);
  say("you", "Назначаю: " + t[1]);
  say({lab:"lab", img:"img", inv:"path", cons:"cons"}[t[0]], t[2] === "—" ? "Без значимых находок." : t[2]);
  C.score += {need:2, ok:1, no:-1, harm:-4}[t[3]];
  if (t[3] === "harm"){
    buzz(false);
    setStatus(-20);
    say("boss", `<span class="pill bad">Осложнение</span><p>${br(t[4])}</p>`, true);
    logErr(`${C.cs.p.n}: опасное назначение — ${t[1]}`);
  }
  updBand();
  dockWorkup();
}
function nextStep(){
  C.si++;
  if (C.si >= C.steps.length) return finishCase();
  const st = C.steps[C.si];
  if (st.pre) say(st.pre[0], st.pre[1]);
  if (st.t === "talk"){ C.tk = 0; return talkTurn(); }
  if (st.t === "scan") return scanStep();
  ask(st.h, st.q + (st.t === "multi" ? "\n(можно выбрать несколько)" : ""));
  const dock = document.getElementById("dock");
  if (st.t === "single"){
    dock.innerHTML = `<div class="opts">${st.o.map((o, i) => `<button class="opt" data-i="${i}">${tx(o[0])}</button>`).join("")}</div>`;
  } else {
    dock.innerHTML = `<div class="opts">${st.o.map((o, i) => `<button class="opt" data-m="${i}" aria-pressed="false">${tx(o[0])}</button>`).join("")}</div>
      <div class="dock-f"><button class="btn primary" id="confirmMulti">Подтвердить выбор</button></div>`;
  }
}
const isDx = st => /^Диагноз/.test(st.h);
/* категория шага для оценки «как на олимпиаде» */
const stepCat = st => st.t === "talk" ? "Коммуникация" : st.t === "scan" ? "Снимки и манипуляции" : isDx(st) ? "Диагноз" : /^(Препараты|Взаимодействия)/.test(st.h) ? "Препараты" : "Тактика и лечение";
const CATS = ["Анамнез", "Обследование", "Снимки и манипуляции", "Диагноз", "Тактика и лечение", "Препараты", "Коммуникация", "Безопасность"];
function answerSingle(i){
  const st = C.steps[C.si], o = st.o[i], right = st.o.find(x => x[1]);
  say("you", o[0]);
  buzz(o[1]);
  C.res.push({cat:stepCat(st), got:o[1] ? 1 : 0, max:1});
  if (o[1]) C.score += 5;
  else { setStatus(isDx(st) ? -10 : -5); logErr(`${C.cs.p.n} · ${st.h}: выбрано «${o[0]}», верно — «${right[0]}»`); }
  let h = `<span class="pill ${o[1] ? "ok" : "bad"}">${o[1] ? "Верно" : "Неверно"}</span><p>${br(o[2])}</p>`;
  if (!o[1]) h += `<p><b>Правильно:</b> ${tx(right[0])}</p><p>${br(right[2])}</p>`;
  h += `<details><summary>Разбор всех вариантов</summary><ul class="why">${st.o.map(x => `<li class="${x[1] ? "is-ok" : "is-bad"}"><span class="mk">${x[1] ? "✓" : "✗"}</span><b>${tx(x[0])}</b><br>${br(x[2])}</li>`).join("")}</ul></details>`;
  say("boss", h, true);
  updBand();
  dockNext();
}
function answerMulti(){
  const st = C.steps[C.si];
  const sel = [...document.querySelectorAll('#dock [data-m][aria-pressed="true"]')].map(b => +b.dataset.m);
  say("you", sel.length ? sel.map(i => "• " + st.o[i][0]).join("\n") : "Ничего не назначаю.");
  let bad = 0, miss = 0;
  const items = st.o.map((o, i) => {
    const on = sel.includes(i);
    if (on && o[1]){ C.score += 2; return ["is-ok", "✓ Верно", o]; }
    if (on && !o[1]){ C.score -= 2; bad++; setStatus(-6); logErr(`${C.cs.p.n} · ${st.h}: лишнее — «${o[0]}»`); return ["is-bad", "✗ Ошибка", o]; }
    if (!on && o[1]){ C.score -= 1; miss++; return ["is-miss", "○ Пропущено", o]; }
    return ["is-neutral", "— Верно не выбрано", o];
  });
  const right = st.o.filter(o => o[1]).length;
  C.res.push({cat:stepCat(st), got:Math.max(0, right - miss - bad), max:right});
  const pill = bad ? ["bad", "Есть ошибки"] : miss ? ["warn", "Частично"] : ["ok", "Верно"];
  buzz(!bad);
  say("boss", `<span class="pill ${pill[0]}">${pill[1]}</span><ul class="why">${items.map(x => `<li class="${x[0]}"><span class="mk">${x[1]}</span><b>${tx(x[2][0])}</b><br>${br(x[2][2])}</li>`).join("")}</ul>`, true);
  updBand();
  dockNext();
}
function dockNext(){ document.getElementById("dock").innerHTML = `<div class="dock-f"><button class="btn primary" id="nextStep">Дальше →</button></div>`; }
function finishCase(){
  const cs = C.cs;
  const missed = C.tests.map((t, i) => [t, i]).filter(([t, i]) => t[3] === "need" && !C.ordered.includes(i)).map(x => x[0]);
  C.score -= missed.length * 2;
  const hxr = cs.hx ? hxRows() : [];
  C.score += hxr.filter(r => r[0] === "need").length * 2 - hxr.filter(r => r[0] === "no").length;
  updBand();
  const pct = Math.max(0, Math.round(C.score / C.max * 100));
  const outcome = C.status >= 70 ? "стабилен" : C.status >= 40 ? "осложнения" : "реанимация";
  const rec = S.cases[cs.id] || {best:0, plays:0};
  S.cases[cs.id] = {best:Math.max(rec.best, pct), plays:rec.plays + 1, last:pct};
  save();
  const cats = caseCats(hxr);
  cats.forEach(([n, v]) => { const a = S.cats[n] || {sum:0, n:0}; S.cats[n] = {sum:a.sum + v, n:a.n + 1}; });
  save();
  if (C.shift) C.shift.results.push({kind:"case", id:cs.id, p:cs.p, dx:cs.dx, pct, status:C.status, outcome, cats});
  const rows = C.ordered.map(i => C.tests[i]).map(t => [t[3], t]).concat(missed.map(t => ["miss", t]));
  const html = `
    <p class="eyebrow">Разбор случая</p>
    <h2>${tx(cs.dx)}</h2>
    <div class="rep-k"><div><b>${pct}%</b><span>результат</span></div><div><b>${C.status}</b><span>состояние</span></div><div><b>${outcome}</b><span>исход смены</span></div></div>
    <h3>Оценка по категориям</h3>${catsHtml(cats)}
    ${hxr.length ? `<h3>Анамнез</h3>
    <div class="tbl"><table><tbody>${hxr.map(([v, q]) => `<tr><td><span class="pill ${VERD[v][0]}">${VERD[v][1]}</span></td><td>${tx(q.t)}<div class="c">${tx(q.c)}</div></td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="margin-top:8px;font-size:13.5px">Полностью: ${tx(cs.intro.map(m => m[1]).join(" "))}</p>` : ""}
    <h3>Обследование</h3>
    <div class="tbl"><table><tbody>${rows.map(([v, t]) => `<tr><td><span class="pill ${VERD[v][0]}">${VERD[v][1]}</span></td><td>${tx(t[1])}<div class="c">${tx(t[4])}</div></td></tr>`).join("")}</tbody></table></div>
    <h3>Запомнить</h3><ul class="pearls">${cs.pearls.map(x => `<li>${tx(x)}</li>`).join("")}</ul>
    ${cs.drugs.length ? `<h3>Препараты случая</h3><div class="chips">${cs.drugs.map(id => `<button class="chip" data-drug="${id}">${esc(byId[id].n)}${byId[id].ru.s !== "ok" ? " ⚑" : ""}</button>`).join("")}</div>` : ""}
    <h3>Источники</h3><ol class="src">${cs.src.map(x => `<li>${tx(x)}</li>`).join("")}</ol>`;
  say("report", html, true);
  const sh = C.shift;
  document.getElementById("dock").innerHTML = `<div class="dock-f">${
    sh ? shiftButton(sh)
       : `<button class="btn" data-go="patients">К списку</button><button class="btn primary" id="randomCase">Случайный пациент</button>`}</div>`;
}
/* оценка случая по категориям, 0–100 */
function caseCats(hxr){
  const ord = C.ordered.map(i => C.tests[i]), cnt = v => ord.filter(t => t[3] === v).length;
  const need = C.tests.filter(t => t[3] === "need").length;
  const out = [["Обследование", need ? (cnt("need") + cnt("ok") * 0.5 - cnt("no") * 0.5 - cnt("harm")) / need * 100 : 100]];
  if (C.cs.hx){
    const k = v => hxr.filter(r => r[0] === v).length, all = C.cs.hx.q.filter(q => q.v === "need").length;
    out.unshift(["Анамнез", (k("need") + k("whom") * 0.5 - k("no") * 0.5) / all * 100]);
  }
  for (const n of ["Снимки и манипуляции", "Диагноз", "Тактика и лечение", "Препараты", "Коммуникация"]){
    const r = C.res.filter(x => x.cat === n);
    if (r.length) out.push([n, r.reduce((a, x) => a + x.got, 0) / r.reduce((a, x) => a + x.max, 0) * 100]);
  }
  out.push(["Безопасность", 100 - cnt("harm") * 50]);
  return out.map(([n, v]) => [n, Math.max(0, Math.min(100, Math.round(v))), 1]);
}
/* средние по категориям из списка оценок [[[название, балл], …], …] */
function avgCats(list){
  return CATS.map(n => { const v = list.map(c => (c.find(x => x[0] === n) || [])[1]).filter(x => x !== undefined); return v.length ? [n, Math.round(v.reduce((a, b) => a + b, 0) / v.length), 1] : null; }).filter(Boolean);
}
function shiftReport(sh){
  setNav("smena");
  tgBack(true);
  const avg = Math.round(sh.results.reduce((a, r) => a + r.pct, 0) / sh.results.length);
  app.innerHTML = `
  <section class="page-h"><p class="eyebrow">Смена сдана</p><h1>Средний результат — ${avg}%</h1>
  <p class="lede">${avg >= 80 ? "Сильная смена: дети стабильны, назначения точные." : avg >= 55 ? "Неплохо, но есть пробелы — посмотрите разборы и ошибки в «Прогрессе»." : "Тяжёлая смена. Вернитесь к разборам и к справочнику препаратов."}</p></section>
  <h3 class="grp eyebrow">По категориям</h3>${catsHtml(avgCats(sh.results.filter(r => r.kind === "case").map(r => r.cats)))}
  <h3 class="grp eyebrow">Пациенты смены</h3>
  <div class="list">${sh.results.map(r => `<button class="case-row" ${r.kind === "em" ? `data-em="${r.id}" data-timed="1"` : `data-case="${r.id}"`}>${face(r.p, 40)}<span class="cn">${esc(r.p.n)}, ${esc(r.p.age)}</span><span class="cc">${tx(r.dx)}</span><span class="cd">${r.kind === "em" ? `неотложка · исход: ${r.outcome}` : `исход: ${r.outcome} · состояние ${r.status}`}</span><span class="cs">${r.pct}%</span></button>`).join("")}</div>
  <div class="row" style="margin-top:16px"><button class="btn primary" id="startShift">Новая смена</button><button class="btn" data-go="progress">Мои ошибки</button></div>`;
  window.scrollTo(0, 0);
}

/* ---------- список пациентов ---------- */
function renderList(){
  // без разделов по категориям: категория подсказывает диагноз (отзыв врачей)
  const list = CS.slice().sort((a, b) => a.p.n.localeCompare(b.p.n, "ru"));
  app.innerHTML = `<section class="page-h"><h1>Пациенты</h1><p class="lede">Только имя, возраст и жалоба. Диагноз откроется, когда пройдёте случай. Опухоли перемешаны с состояниями, которые их имитируют.</p></section>
  <div class="list">${list.map(c => {
    const r = S.cases[c.id];
    return `<button class="case-row" data-case="${c.id}">${face(c.p, 40)}<span class="cn">${esc(c.p.n)}, ${esc(c.p.age)}</span><span class="cc">${tx(c.cc)}</span>${r ? `<span class="cd">${tx(c.dx)}</span>` : ""}<span class="cs">${r ? r.best + "%" : "—"}</span></button>`;
  }).join("")}</div>`;
}

/* ---------- лечить или нет ---------- */
function startBlitz(){ setNav("blitz"); B = {items:shuffle(BL).slice(0, 15), i:0, score:0, wrong:[]}; blitzQ(); }
function blitzQ(){
  const it = B.items[B.i];
  app.innerHTML = `<section class="blitz">
    <div class="blitz-top"><span class="eyebrow">Лечить или нет</span><span class="count">${B.i + 1} / ${B.items.length} · верно ${B.score}</span></div>
    <div class="progress"><i style="width:${B.i / B.items.length * 100}%"></i></div>
    <article class="card situation"><p>${tx(it.q)}</p></article>
    <div class="yn"><button class="btn yes" data-a="1">Делать</button><button class="btn no" data-a="0">Не делать</button></div>
    <div id="bfb"></div></section>`;
}
function blitzAnswer(a){
  const it = B.items[B.i], ok = (a === 1) === it.a;
  buzz(ok);

/* тест по препаратам */
function makeQuiz(n){
  const qs = [], used = new Set();
  let guard = 0;
  while (qs.length < n && guard++ < 300){
    const type = pick(["tox","tox","name","rep"]);
    if (type === "rep"){
      const pool = DR.filter(d => d.rep && !used.has("r" + d.id));
      if (!pool.length) continue;
      const d = pick(pool), others = shuffle(DR.filter(x => x.rep && x.id !== d.id)).slice(0, 3);
      if (others.length < 3) continue;
      used.add("r" + d.id);
      qs.push({d, q:`${d.n}: ${RU[d.ru.s].toLowerCase()}. Как поступают?`, opts:shuffle([{t:d.rep, ok:true}, ...others.map(x => ({t:x.rep, ok:false}))])});
    } else {
      const pool = DR.filter(d => !used.has("t" + d.id));
      const d = pick(pool);
      const seen = new Set([d.key]);
      const others = shuffle(DR.filter(x => x.cls !== d.cls)).filter(x => !seen.has(x.key) && seen.add(x.key)).slice(0, 3);
      used.add("t" + d.id);
      if (type === "tox") qs.push({d, q:`${d.n}: что для него наиболее характерно?`, opts:shuffle([{t:d.key, ok:true}, ...others.map(x => ({t:x.key, ok:false}))])});
      else qs.push({d, q:`Какой препарат: «${d.key}»?`, opts:shuffle([{t:d.n, ok:true}, ...others.map(x => ({t:x.n, ok:false}))])});
    }
  }
  return qs;
}
function startQuiz(){ Q = {qs:makeQuiz(10), i:0, score:0}; quizQ(); }
function quizQ(){

function quizAnswer(i){

/* ---------- неотложка: мини-игра на время ----------
   Сценарии — в emerg.js. Время игровое: с таймером идёт само (2 игровые секунды за 1 реальную)
   и прибавляется за каждое действие; без таймера — только за действия и «Наблюдать». */
const ER = window.EMERG || [];
let E = null, eTimer = null;
/* время: на табло и в чате — время суток от начала сценария (sc.clock), в разборе — сколько прошло с начала */
const wall = t => {
  const [h, m] = (E.sc.clock || "00:00").split(":").map(Number), x = (h * 3600 + m * 60 + Math.floor(t)) % 86400, p2 = v => String(v).padStart(2, "0");
  return p2(Math.floor(x / 3600)) + ":" + p2(Math.floor(x / 60) % 60) + ((E.sc.speed || 2) <= 2 ? ":" + p2(x % 60) : "");
};
const durLabel = t => { t = Math.max(0, Math.floor(t)); const m = Math.floor(t / 60), sec = t % 60; return t < 60 ? `${sec} с` : m < 10 && sec ? `${m} мин ${sec} с` : `${m} мин`; };
function stopEmerg(){ if (eTimer) clearInterval(eTimer); eTimer = null; E = null; }
function renderEmerg(){
  setNav("emerg");
  app.innerHTML = `<section class="page-h"><h1>Неотложка</h1>
    <p class="lede">Состояние меняется на глазах. Решайте быстро: промедление и ошибки ведут в реанимацию или к остановке сердца. В конце — разбор по шкале времени и оценка по категориям.</p></section>
    <div class="list">${ER.map(sc => { const b = S.emerg[sc.id]; return `<div class="card em-card"><div>${face(sc.p, 48)}<b>${esc(sc.p.n)}, ${esc(sc.p.age)}</b><p class="muted">${tx(sc.teaser)}</p>${b ? `<p class="muted">лучший результат: ${b.best}%</p>` : ""}</div>
      <div class="row"><button class="btn primary" data-em="${sc.id}" data-timed="1">С таймером</button><button class="btn" data-em="${sc.id}" data-timed="0">Без таймера</button></div></div>`; }).join("")}</div>
    <p class="muted" style="margin-top:12px;font-size:13.5px">Без таймера время идёт только от ваших действий — для первого знакомства с алгоритмом.</p>`;
}
function startEmerg(id, timed, shift){
  stopEmerg();
  C = null;
  const sc = ER.find(x => x.id === id), p = sc.p;
  E = {sc, timed, st:sc.start(), used:new Set(), shift:shift || null};
  setNav(shift ? "smena" : "emerg");
  tgBack(true);
  app.innerHTML = `
  <div class="band">
    ${face(p, 52)}<div class="tag"><span class="eyebrow">${shift ? `Срочный вызов · ${shift.i + 1} из ${shift.list.length}` : `Неотложка${timed ? "" : " · без таймера"}`}</span><b>${esc(p.n)}, ${esc(p.age)}</b></div>
    <dl class="anthro"><div><dt>Вес</dt><dd>${comma(p.w)} кг</dd></div><div><dt>Рост</dt><dd>${p.h} см</dd></div></dl>
    <div class="em-clock" id="eClock" aria-label="Время">${wall(0)}</div>
  </div>
  <div class="mon" id="mon" role="group" aria-label="Монитор"></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="dock" id="dock"></div>`;
  document.getElementById("mon").style.top = document.querySelector(".top").offsetHeight + "px";
  window.scrollTo(0, 0);
  if (shift) say("sys", "Посреди смены — крик из соседней палаты. Медсестра бежит к вам.");
  say("sys", sc.from);
  emFlush();
  emDraw();
  emDock();
  if (timed) eTimer = setInterval(() => { if (E && !E.st.end && !document.hidden) emAdvance(0.25 * (E.sc.speed || 2)); }, 250);
}
function emFlush(){
  const st = E.st;
  while (st.out.length){ const [w, t] = st.out.shift(); say(w, `<span class="tm">${wall(st.t)}</span>${br(t)}`, true); }
}
function emDraw(){
  const cell = (n, val, unit, crit) => `<div class="mv${crit ? " crit" : ""}"><span>${n}</span><b>${val}</b><small>${unit}</small></div>`;
  // сценарий может задать свои показатели монитора: cells(st) → [{n, val, unit, crit}]
  if (E.sc.cells){
    document.getElementById("mon").innerHTML = E.sc.cells(E.st).map(c => cell(c.n, c.val, c.unit, c.crit)).join("");
    document.getElementById("eClock").textContent = wall(E.st.t);
    return;
  }
  const v = E.sc.vitals(E.st), k = E.sc.crit;
  document.getElementById("mon").innerHTML =
    cell("ЧСС", v.hr, v.rhythm || "уд/мин", v.hr >= k.hr || v.rhythm) +
    cell("АД", `${v.sbp}/${v.dbp}`, "мм рт. ст.", v.sbp < k.sbp) +
    cell("SpO₂", v.spo2, "%", v.spo2 < k.spo2) +
    cell("ЧДД", v.rr, "в мин", v.rr >= k.rr);
  document.getElementById("eClock").textContent = wall(E.st.t);
}
function emAdvance(dt){
  const st = E.st;
  for (let x = 0; x < dt && !st.end; x += 0.5){ E.sc.tick(st, 0.5); st.t += 0.5; }
  emFlush();
  emDraw();
  if (st.end) emFinish();
}
function emDock(){
  const st = E.st;
  const acts = E.sc.actions.map(a => {
    const off = (a.once && E.used.has(a.id)) || (a.group === "pos" && st.pos);
    return `<button class="opt" data-act="${a.id}" ${off ? "disabled" : ""}>${tx(a.label)}</button>`;
  }).join("");
  document.getElementById("dock").innerHTML = `
    <div class="dock-h"><span>Действия</span><span class="muted">${E.timed ? "время идёт" : "время идёт только от действий"}</span></div>
    <div class="acts">${acts}</div>
    <div class="dock-f"><button class="btn" id="eWait">Наблюдать ${E.sc.waitLabel || "30 с"}</button></div>`;
}
/* диалог действия: ask = {kind:"dose", title, unit, routes?} — ввести дозу (и путь);
   {kind:"choice", title, options:[[значение, подпись]]} — выбрать вариант */
function emAsk(a){
  const sc = E.sc, q = a.ask;
  E.askId = a.id;
  const head = `<div class="dock-h"><span>${tx(q.title)}</span><span class="muted">вес ${comma(sc.p.w)} кг</span></div>`;
  const foot = `<div class="dock-f"><button class="btn" id="eCancel">Отмена</button>${q.kind === "dose" ? `<button class="btn primary" id="eGive">Ввести</button>` : ""}</div>`;
  document.getElementById("dock").innerHTML = head + (q.kind === "dose"
    ? `${q.routes ? `<div class="chips" id="eRoute">${q.routes.map(([k, l], i) => `<button class="chip" data-route="${k}" aria-pressed="${i === 0}">${esc(l)}</button>`).join("")}</div>` : ""}
       <label class="em-dose">Доза, ${esc(q.unit)} <input id="eDose" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>`
    : `<div class="opts">${q.options.map(([v, l]) => `<button class="opt" data-ch="${esc(v)}">${tx(l)}</button>`).join("")}</div>`) + foot;
  const inp = document.getElementById("eDose");
  if (inp) inp.focus();
}
function emGive(){
  const inp = document.getElementById("eDose"), mg = parseFloat(String(inp.value).replace(",", "."));
  if (!(mg > 0) || mg > 5000){ inp.value = ""; inp.classList.add("bad"); inp.placeholder = "введите дозу"; inp.focus(); return; }
  const r = document.querySelector('#eRoute [aria-pressed="true"]');
  emAct(E.askId, {mg, dose:mg, route:r ? r.dataset.route : null});
}
function emAct(id, arg){
  const a = E.sc.actions.find(x => x.id === id);
  if (a.ask && !arg) return emAsk(a);
  E.used.add(id);
  const n = E.st.events.length;
  E.sc.act(E.st, id, arg);
  if (E.st.events.slice(n).some(e => e.mark === "bad")) buzz(false);
  emAdvance(a.cost);
  if (E && !E.st.end) emDock();
}
function emFinish(){
  if (eTimer){ clearInterval(eTimer); eTimer = null; }
  const sc = E.sc, st = E.st, r = sc.score(st);
  if (st.end === "dead") r.total = Math.min(r.total, 30); // гибель пациента — не больше 30% при любых остальных баллах
  const rec = S.emerg[sc.id] || {best:0, plays:0};
  S.emerg[sc.id] = {best:Math.max(rec.best, r.total), plays:rec.plays + 1, last:r.total};
  save();
  st.events.filter(e => e.mark === "bad").forEach(e => logErr(`Неотложка · ${sc.p.n}: ${e.text}${e.note ? " — " + e.note : ""}`));
  buzz(st.end === "ok");
  const MK = {ok:["ok","✓"], warn:["warn","!"], bad:["bad","✗"], mid:["mid","·"]};
  const outcome = {ok:"стабильна", icu:"реанимация", dead:"остановка"}[st.end];
  if (E.shift) E.shift.results.push({kind:"em", id:sc.id, p:sc.p, dx:sc.title, pct:r.total, outcome});
  say("report", `
    <p class="eyebrow">Разбор неотложки</p>
    <h2>${tx(sc.title)}</h2>
    <div class="rep-k"><div><b>${r.total}%</b><span>результат</span></div><div><b>${durLabel(st.t)}</b><span>длительность</span></div><div><b>${outcome}</b><span>исход</span></div></div>
    <h3>Оценка по категориям</h3>${catsHtml(r.cats)}
    <h3>Ваши действия</h3>
    <div class="tbl"><table><tbody>${st.events.map(e => `<tr><td><span class="tm">+${durLabel(e.t)}</span></td><td><span class="pill ${MK[e.mark][0]}">${MK[e.mark][1]}</span> ${tx(e.text)}${e.note ? `<div class="c">${tx(e.note)}</div>` : ""}</td></tr>`).join("") || `<tr><td></td><td>Действий не было.</td></tr>`}</tbody></table></div>
    <h3>Как нужно было</h3>
    <div class="tbl"><table><tbody>${sc.ideal.map(([t, x]) => `<tr><td><span class="tm">${tx(t)}</span></td><td>${tx(x)}</td></tr>`).join("")}</tbody></table></div>
    <h3>Запомнить</h3><ul class="pearls">${sc.pearls.map(x => `<li>${tx(x)}</li>`).join("")}</ul>
    <h3>Источники</h3><ol class="src">${sc.sources.map(x => `<li>${tx(x)}</li>`).join("")}</ol>`, true);
  if (st.end === "dead") return emAgain();
  ask("Что дальше", sc.post.q);
  E.post = shuffle(sc.post.o);
  document.getElementById("dock").innerHTML = `<div class="opts">${E.post.map((o, i) => `<button class="opt" data-eq="${i}">${tx(o[0])}</button>`).join("")}</div>`;
}
function emPost(i){

  if (!o[1]) logErr(`Неотложка · ${E.sc.post.q} — верно «${right[0]}»`);

  emAgain();
}
function emAgain(){

  document.getElementById("dock").innerHTML = `<div class="dock-f"><button class="btn" data-go="emerg">К списку</button><button class="btn primary" data-em="${E.sc.id}" data-timed="${E.timed ? 1 : 0}">Ещё раз</button></div>`;

    <div class="stat"><b>${Math.max(0, ...Object.values(S.emerg).map(x => x.best))}%</b><span>лучшая неотложка</span></div>
  </div>
  ${Object.keys(S.cats).length ? `<h3 class="grp eyebrow">Сильные и слабые стороны — среднее по всем случаям</h3>${catsHtml(CATS.filter(n => S.cats[n]).map(n => [n, Math.round(S.cats[n].sum / S.cats[n].n), 1]))}` : ""}
  <h3 class="grp eyebrow">Слабые места — пройдите ещё раз</h3>
  <div class="list">${done.filter(c => S.cases[c.id].best < 80).sort((a, b) => S.cases[a.id].best - S.cases[b.id].best).map(c => `<button class="case-row" data-case="${c.id}">${face(c.p, 40)}<span class="cn">${esc(c.p.n)}, ${esc(c.p.age)}</span><span class="cc">${tx(c.dx)}</span><span class="cs">${S.cases[c.id].best}%</span></button>`).join("") || `<p class="muted">Пока нет случаев с результатом ниже 80%.</p>`}</div>
  <h3 class="grp eyebrow">Последние ошибки</h3>
  <div class="list">${S.errors.slice(0, 20).map(e => `<div class="err">${esc(e.t)}</div>`).join("") || `<p class="muted">Ошибок пока нет.</p>`}</div>
  <div class="row" style="margin-top:20px" id="resetRow"><button class="btn" id="reset">Сбросить прогресс</button></div>`;
}

/* ---------- события ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, summary");
  if (e.target === modal) return closeModal();
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) return go(ds.go);
  if (ds.drug) return openDrug(ds.drug);
  if (ds.em) return startEmerg(ds.em, ds.timed === "1");
  if (ds.act) return emAct(ds.act);
  if (ds.ch !== undefined) return emAct(E.askId, {v:ds.ch});
  if (ds.route){ document.querySelectorAll("#eRoute .chip").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (ds.eq !== undefined) return emPost(+ds.eq);
  if (ds.hq !== undefined) return askHx(+ds.hq);
  if (ds.hw){ C.hx.who = ds.hw; return dockHx(); }
  if (ds.hg){ C.hx.g = ds.hg; return dockHx(); }
  if (ds.tk !== undefined) return answerTalk(+ds.tk);
  if (ds.case) return startCase(CS.find(c => c.id === ds.case), null);
  if (ds.cat){ homeCat = ds.cat; document.querySelectorAll("#cats .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === homeCat)); return; }
  if (ds.g){ C.group = ds.g; return dockWorkup(); }
  if (ds.t !== undefined) return orderTest(+ds.t);
  if (ds.i !== undefined) return answerSingle(+ds.i);
  if (ds.m !== undefined) return t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true");
  if (ds.a !== undefined) return blitzAnswer(+ds.a);
  if (ds.qa !== undefined) return quizAnswer(+ds.qa);
  if (ds.dg){ dFilter.g = ds.dg; document.querySelectorAll("#dg .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.dg === dFilter.g)); return drugList(); }
  switch (t.id){
    case "startShift": return startShift();
    case "exBtn": return examine();
    case "toSteps": say("you", "Обследования достаточно."); return nextStep();
    case "nextStep": return nextStep();
    case "confirmMulti": return answerMulti();
    case "nextPatient": return shiftNext();
    case "shiftReport": return shiftReport(SH);
    case "randomCase": return startCase(pick(CS), null);
    case "bnext": B.i++; return B.i < B.items.length ? blitzQ() : blitzEnd();
    case "bagain": return startBlitz();
    case "quizBtn": return startQuiz();
    case "qnext": Q.i++; return Q.i < Q.qs.length ? quizQ() : quizEnd();
    case "mclose": return closeModal();
    case "eWait": return emAdvance(E.sc.waitSec || 30);
    case "eCancel": return emDock();
    case "eGive": return emGive();
    case "hxAsk": return askFree();
    case "hxDone": say("you", "Достаточно, перехожу к осмотру."); return examine();
    case "tkNext": return talkTurn();
    case "scReset": C.scan.pts = []; scanMarks(); return scanDock();
    case "scCheck": return scanCheck();
    case "reset":
      document.getElementById("resetRow").innerHTML = `<span class="muted">Удалить весь прогресс?</span><button class="btn" id="resetYes">Да, удалить</button><button class="btn" data-go="progress">Отмена</button>`;
      return;
    case "resetYes": S = fresh(); save(); return renderProgress();
  }
});
const tip = document.createElement("div");
tip.className = "abtip";
tip.setAttribute("role", "tooltip");
tip.hidden = true;
document.body.appendChild(tip);
let holdT = null, holdXY = null, eatClick = false;
function showTip(a){
  tip.innerHTML = `<b>${esc(a.textContent)}</b>${esc(a.title)}`;
  tip.hidden = false;
  const r = a.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const y = r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8;
  tip.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
const stopHold = () => { clearTimeout(holdT); holdT = null; };
document.addEventListener("pointerdown", e => {
  const a = e.target.closest && e.target.closest("abbr.ab");
  hideTip();
  if (!a || !a.closest("button, summary")) return;
  holdXY = [e.clientX, e.clientY];
  holdT = setTimeout(() => { showTip(a); eatClick = true; }, 450);
});
document.addEventListener("pointermove", e => { if (holdT && Math.hypot(e.clientX - holdXY[0], e.clientY - holdXY[1]) > 10) stopHold(); });
document.addEventListener("pointerup", stopHold);
document.addEventListener("pointercancel", stopHold);
document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest("abbr.ab")) e.preventDefault(); });
document.addEventListener("click", e => {
  if (eatClick){ eatClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const a = e.target.closest("abbr.ab");
  if (a && !a.closest("button, summary")){ e.stopPropagation(); showTip(a); }
}, true);
window.addEventListener("scroll", hideTip, {passive:true});

document.addEventListener("input", e => { if (e.target.id === "dq"){ dFilter.q = e.target.value; drugList(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !modal.hidden) closeModal();
  if (e.key === "Enter" && e.target.id === "eDose") emGive();
  if (e.key === "Enter" && e.target.id === "hxIn") askFree();
});

const start = (location.hash || "").slice(1);
go(VIEWS[start] ? start : "smena");
})();
</script>
